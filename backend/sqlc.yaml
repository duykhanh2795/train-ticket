version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/auth/adapters/outbound/postgres/queries"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/auth/adapters/outbound/postgres/sqlcgen"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_empty_slices: true
