# Copy to config.yaml for local development, or provide these as environment variables.
# Environment variables take precedence over this file.
http_address: ":8080"
http_trusted_proxies: [] # Set only the IPs/CIDRs of reverse proxies you control.

# How long a seat remains temporarily held before payment confirmation.
booking_hold_duration: 10m

# Keep credentials in DATABASE_URL rather than committing them to this file.
database_url: ""
database_pool_max_conns: 10 # Per API/worker process; tune against Neon connection limits.

# Kafka is used by the background worker to publish booking lifecycle events.
kafka_brokers:
  - "localhost:9092"
kafka_topic: "booking.events"
kafka_consumer_group: "notification-v1"
worker_metrics_address: "127.0.0.1:9091"

# Payment mode: vnpay (default) or mock. Mock is only allowed when HTTP_ADDRESS
# binds to a loopback interface and PUBLIC_APP_URL is a local HTTP origin.
payment_mode: "vnpay"

# VNPAY PAY sandbox. Configure all three values to enable VNPAY checkout.
# Register https://your-public-api.example/api/v1/payments/vnpay/ipn as IPN URL
# in VNPAY Merchant Admin; the browser return URL is only for display.
vnpay_tmn_code: ""
vnpay_hash_secret: ""
vnpay_return_url: "http://localhost:3000/payment/result"

# Optional: the worker sends booking confirmation mail when SMTP is configured.
# For local Mailpit use localhost:1025, mode none, and no credentials.
# Production SMTP should use starttls or implicit TLS.
smtp_host: ""
smtp_port: 587
smtp_mode: "starttls"
smtp_username: ""
smtp_password: ""
smtp_from: "" # Bare sender address, e.g. tickets@example.com.
public_app_url: "http://localhost:3000"
